            $(".errorlogin").text('');

            $('#username_id').val(localusername);
             $(".forgot_pass").slideUp("slow", function() {
                $(".login__form").slideDown("slow");
             });
         });
         var myDate = new Date();
         var hrs = myDate.getHours();
         var greet;
         var delay=150;
         var elem = $(".lblGreetings");
         if (hrs < 12)
             greet = 'Good Morning ';
         else if (hrs >= 12 && hrs <= 17)
             greet = 'Good Afternoon ';
         else if (hrs >= 17 && hrs <= 24)
             greet = 'Good Evening ';
         
         //document.getElementById('lblGreetings').innerHTML = greet;

         var addTextByDelay = function(text,elem,delay){
            if(!elem){
                elem = $("body");
            }
            if(!delay){
                delay = 150;
            }
            if(text.length >0){
                //append first character 
                elem.append(text[0]);
                setTimeout(
                    function(){
                        //Slice text by 1 character and call function again                
                        addTextByDelay(text.slice(1),elem,delay);            
                     },delay                 
                    );
            }
         }

        addTextByDelay(greet,elem,delay);

      </script>

      <script>
$('input').attr('autocomplete', 'off');

function encrypt() {
      var t=$('#password').val();
    // alert(window.btoa(t));
      $('#password').val(window.btoa(t));
      temp=$('#username_id').val();
      if(temp!='' && t!='') 
      {
        startLoader();
      }
    }

    function enc(str) {
    var encoded = "";
    for (i=0; i<str.length;i++) {
        var a = str.charCodeAt(i);
        var b = a ^ 123;    // bitwise XOR with any number, e.g. 123
        encoded = encoded+String.fromCharCode(b);
    }
    return encoded;
}
